<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>호르무즈 3D 모델 뷰어</title>
<!--
  모델 뷰어의 틀이다. tools/build-release.py 가 __MANIFEST__ 와 __LIB__ 를 채워
  두 곳에 낸다 — 저장소용(docs/) 과 배포 묶음용(release/hormuz-model-pack/).
  직접 고치지 말고 이 틀을 고친 뒤 다시 만들어야 둘이 어긋나지 않는다.
-->
<style>
  :root {
    --bg: #070d13; --panel: #0e1721; --line: #1d2c3a;
    --text: #dbe7f1; --dim: #7f93a6; --accent: #4fc3f7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text); display: flex;
    font-family: "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  }
  aside {
    width: 280px; flex: none; border-right: 1px solid var(--line);
    overflow-y: auto; background: var(--panel); padding: 14px 12px 40px;
  }
  aside h1 { font-size: 15px; margin: 0 0 3px; }
  aside .hint { font-size: 11.5px; color: var(--dim); margin: 0 0 14px; line-height: 1.5; }
  .group { font-size: 11px; color: var(--dim); margin: 12px 0 4px; letter-spacing: 0.4px; }
  button.item {
    display: block; width: 100%; text-align: left; background: transparent;
    border: 1px solid transparent; border-radius: 7px; color: var(--text);
    padding: 6px 9px; font-size: 12.5px; cursor: pointer; font-family: inherit;
    line-height: 1.35;
  }
  button.item:hover { background: #142130; }
  button.item[aria-current="true"] { background: #123246; border-color: #1d5a72; color: #cfeaf8; }
  button.item small { display: block; color: var(--dim); font-size: 10.5px; }
  main { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .bar {
    position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap;
    align-items: center; gap: 8px; padding: 10px 14px;
    background: linear-gradient(transparent, rgba(7,13,19,0.94) 38%);
  }
  .bar .stat { font-size: 12px; color: var(--dim); margin-right: auto; }
  .bar .stat b { color: var(--text); font-weight: 600; }
  .bar button {
    background: #12202c; border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 5px 12px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .bar button:hover { background: #172c3b; }
  .bar button[aria-pressed="true"] { background: #123246; border-color: #1d5a72; color: #cfeaf8; }
  .title { position: absolute; top: 14px; left: 16px; font-size: 15px; pointer-events: none; }
  .title small { display: block; font-size: 11.5px; color: var(--dim); }
  .notice {
    position: absolute; inset: 0; display: none; place-items: center; text-align: center;
    padding: 30px; background: rgba(7,13,19,0.92); font-size: 13.5px; line-height: 1.7;
  }
  .notice.on { display: grid; }
  .notice code {
    background: #0a1219; border: 1px solid var(--line); border-radius: 5px;
    padding: 2px 7px; color: var(--accent); font-size: 12px;
  }
  @media (max-width: 700px) {
    body { flex-direction: column; }
    aside { width: 100%; height: 40%; border-right: none; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<aside>
  <h1>호르무즈 3D 모델 뷰어</h1>
  <p class="hint">
    끌면 돌아간다 · 휠로 확대 · 오른쪽 끌기로 이동<br>
    보병을 고르면 동작 재생 단추가 나온다.
  </p>
  <div id="list"></div>
</aside>
<main>
  <canvas id="stage"></canvas>
  <div class="title"><span id="name">불러오는 중…</span><small id="sub"></small></div>
  <div class="bar">
    <span class="stat" id="stat"></span>
    <span id="clips"></span>
    <button id="wire" aria-pressed="false">뼈대선</button>
    <button id="spin" aria-pressed="true">자동 회전</button>
    <button id="reset">시점 초기화</button>
  </div>
  <div class="notice" id="notice"></div>
</main>

<script type="module">
import * as THREE from "__LIB__/three.module.js";
import { GLTFLoader } from "__LIB__/GLTFLoader.js";
import { MeshoptDecoder } from "__LIB__/meshopt_decoder.module.js";

const MODELS = __MANIFEST__;

const canvas = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1118);
scene.add(new THREE.HemisphereLight(0xbfe9f5, 0x14202a, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(4, 6, 5);
const rim = new THREE.DirectionalLight(0x9fdcff, 1.25);
rim.position.set(-5, 3, -4);
const fill = new THREE.DirectionalLight(0xffffff, 0.55);
fill.position.set(0, -4, 2);
scene.add(key, rim, fill);

const grid = new THREE.GridHelper(6, 12, 0x1d3446, 0x14232f);
grid.position.y = -1.02;
scene.add(grid);

const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 200);
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);

/* 시점 조작. 바깥 라이브러리를 쓰지 않으려고 필요한 만큼만 직접 만들었다.
   중심점을 기준으로 각도 둘과 거리 하나면 충분하다. */
const view = { theta: 0.9, phi: 1.25, radius: 5, target: new THREE.Vector3(), spin: true };
function applyView() {
  view.phi = Math.min(Math.PI - 0.08, Math.max(0.08, view.phi));
  view.radius = Math.min(60, Math.max(0.6, view.radius));
  camera.position.set(
    view.target.x + view.radius * Math.sin(view.phi) * Math.sin(view.theta),
    view.target.y + view.radius * Math.cos(view.phi),
    view.target.z + view.radius * Math.sin(view.phi) * Math.cos(view.theta)
  );
  camera.lookAt(view.target);
}

let dragging = 0;
let last = null;
canvas.addEventListener("pointerdown", (event) => {
  dragging = event.button === 2 ? 2 : 1;
  last = { x: event.clientX, y: event.clientY };
  view.spin = false;
  document.getElementById("spin").setAttribute("aria-pressed", "false");
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener("pointermove", (event) => {
  if (!dragging || !last) return;
  const dx = event.clientX - last.x;
  const dy = event.clientY - last.y;
  last = { x: event.clientX, y: event.clientY };
  if (dragging === 1) {
    view.theta -= dx * 0.006;
    view.phi -= dy * 0.006;
  } else {
    const scale = view.radius * 0.0016;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
    view.target.addScaledVector(right, -dx * scale).addScaledVector(up, dy * scale);
  }
  applyView();
});
for (const type of ["pointerup", "pointercancel", "pointerleave"]) {
  canvas.addEventListener(type, () => { dragging = 0; last = null; });
}
canvas.addEventListener("contextmenu", (event) => event.preventDefault());
canvas.addEventListener("wheel", (event) => {
  event.preventDefault();
  view.radius *= event.deltaY > 0 ? 1.12 : 0.89;
  applyView();
}, { passive: false });

let current = null;
let mixer = null;
let frameStart = 0;
// 동작 파일은 여러 모델이 함께 쓴다. 한 번 불러온 것은 들고 있는다.
const clipCache = new Map();

function clear() {
  if (!current) return;
  scene.remove(current);
  current.traverse((node) => {
    if (!node.isMesh && !node.isSkinnedMesh) return;
    node.geometry?.dispose();
    const materials = Array.isArray(node.material) ? node.material : [node.material];
    materials.forEach((material) => material?.dispose());
  });
  current = null;
  mixer = null;
}

function frameModel(root) {
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const span = Math.max(size.x, size.y, size.z) || 1;
  root.position.sub(center).multiplyScalar(2 / span);
  root.scale.setScalar(2 / span);
  view.target.set(0, 0, 0);
  view.radius = 4.6;
  view.theta = 0.9;
  view.phi = 1.25;
  applyView();
}

let wireframe = false;
function applyWireframe() {
  if (!current) return;
  current.traverse((node) => {
    if (!node.isMesh && !node.isSkinnedMesh) return;
    const materials = Array.isArray(node.material) ? node.material : [node.material];
    materials.forEach((material) => { if (material) material.wireframe = wireframe; });
  });
}

const notice = document.getElementById("notice");

async function load(entry, button) {
  document.querySelectorAll("button.item").forEach((node) =>
    node.setAttribute("aria-current", node === button ? "true" : "false"));
  document.getElementById("name").textContent = `${entry.family} — ${entry.variant}`;
  document.getElementById("sub").textContent = `${entry.name}.glb`;
  document.getElementById("stat").textContent = "불러오는 중…";
  document.getElementById("clips").innerHTML = "";
  notice.classList.remove("on");

  let gltf;
  try {
    gltf = await loader.loadAsync(entry.url);
  } catch (error) {
    document.getElementById("stat").textContent = "";
    notice.innerHTML = `<div><b>모델을 불러오지 못했다.</b><br>
      이 뷰어는 웹서버로 열어야 한다. 파일을 직접 열면(<code>file://</code>)
      브라우저가 모델 파일 읽기를 막는다.<br><br>
      <code>python -m http.server 8000</code> 으로 띄운 뒤<br>
      <code>http://localhost:8000/viewer.html</code> 로 들어오면 된다.<br><br>
      찾는 경로: <code>${entry.url}</code></div>`;
    notice.classList.add("on");
    return;
  }

  clear();
  current = gltf.scene;
  scene.add(current);
  frameModel(current);
  applyWireframe();

  let triangles = 0;
  current.traverse((node) => {
    if (!node.isMesh && !node.isSkinnedMesh) return;
    const geometry = node.geometry;
    if (!geometry?.attributes?.position) return;
    triangles += geometry.index
      ? geometry.index.count / 3 : geometry.attributes.position.count / 3;
  });
  document.getElementById("stat").innerHTML =
    `<b>${Math.round(triangles).toLocaleString()}</b> 삼각형 · <b>${entry.kb}</b>KB`
    + (entry.note ? ` · ${entry.note}` : "");

  /* 동작은 별도 파일에 들어 있다. 게임이 하는 것과 같은 방식으로 붙인다. */
  const sources = entry.clips.slice();
  if (gltf.animations?.length) sources.unshift(["기본 동작", null]);
  if (!sources.length) return;

  mixer = new THREE.AnimationMixer(current);
  const holder = document.getElementById("clips");
  const buttons = [];
  const setActive = (active) => buttons.forEach((node) =>
    node.setAttribute("aria-pressed", node === active ? "true" : "false"));

  for (const [label, url] of sources) {
    const play = document.createElement("button");
    play.textContent = label;
    buttons.push(play);
    play.addEventListener("click", async () => {
      let clip = gltf.animations?.[0];
      if (url) {
        if (!clipCache.has(url)) {
          play.textContent = "…";
          const extra = await loader.loadAsync(url);
          clipCache.set(url, extra.animations[0]);
          play.textContent = label;
        }
        clip = clipCache.get(url);
      }
      if (!clip) return;
      mixer.stopAllAction();
      mixer.clipAction(clip).reset().setLoop(THREE.LoopRepeat, Infinity).play();
      setActive(play);
    });
    holder.appendChild(play);
  }
  const stop = document.createElement("button");
  stop.textContent = "정지";
  stop.addEventListener("click", () => { mixer.stopAllAction(); setActive(null); });
  buttons.push(stop);
  holder.appendChild(stop);
}

const list = document.getElementById("list");
let currentFamily = null;
let first = null;
for (const entry of MODELS) {
  if (entry.family !== currentFamily) {
    currentFamily = entry.family;
    const heading = document.createElement("div");
    heading.className = "group";
    heading.textContent = currentFamily;
    list.appendChild(heading);
  }
  const button = document.createElement("button");
  button.className = "item";
  button.innerHTML = `${entry.variant}<small>${entry.triangles.toLocaleString()} 삼각형`
    + `${entry.clips.length ? " · 동작 있음" : ""}${entry.note ? ` · ${entry.note}` : ""}</small>`;
  button.addEventListener("click", () => load(entry, button));
  list.appendChild(button);
  if (!first) first = { entry, button };
}

document.getElementById("wire").addEventListener("click", (event) => {
  wireframe = !wireframe;
  event.currentTarget.setAttribute("aria-pressed", String(wireframe));
  applyWireframe();
});
document.getElementById("spin").addEventListener("click", (event) => {
  view.spin = !view.spin;
  event.currentTarget.setAttribute("aria-pressed", String(view.spin));
});
document.getElementById("reset").addEventListener("click", () => {
  if (current) frameModel(current);
});

function resize() {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (!width || !height) return;
  renderer.setSize(width, height, false);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

renderer.setAnimationLoop(() => {
  const now = performance.now();
  const delta = frameStart ? (now - frameStart) / 1000 : 0;
  frameStart = now;
  if (mixer) mixer.update(Math.min(delta, 0.05));
  if (view.spin) { view.theta += delta * 0.35; applyView(); }
  resize();
  renderer.render(scene, camera);
});

applyView();
if (first) load(first.entry, first.button);
</script>
</body>
</html>
