ips": []}, {"family": "지하 진입부", "variant": "원본", "note": "", "name": "bunker-entrance-meshy-web-v1", "url": "../assets/models/objectives-v1/bunker-entrance-meshy-web-v1.glb", "triangles": 1414, "kb": 60, "clips": []}];

const canvas = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1118);
scene.add(new THREE.HemisphereLight(0xbfe9f5, 0x14202a, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(4, 6, 5);
const rim = new THREE.DirectionalLight(0x9fdcff, 1.25);
rim.position.set(-5, 3, -4);
const fill = new THREE.DirectionalLight(0xffffff, 0.55);
fill.position.set(0, -4, 2);
scene.add(key, rim, fill);

const grid = new THREE.GridHelper(6, 12, 0x1d3446, 0x14232f);
grid.position.y = -1.02;
scene.add(grid);

const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 200);
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);

/* 시점 조작. 바깥 라이브러리를 쓰지 않으려고 필요한 만큼만 직접 만들었다.
   중심점을 기준으로 각도 둘과 거리 하나면 충분하다. */
const view = { theta: 0.9, phi: 1.25, radius: 5, target: new THREE.Vector3(), spin: true };
function applyView() {
  view.phi = Math.min(Math.PI - 0.08, Math.max(0.08, view.phi));
  view.radius = Math.min(60, Math.max(0.6, view.radius));
  camera.position.set(
    view.target.x + view.radius * Math.sin(view.phi) * Math.sin(view.theta),
    view.target.y + view.radius * Math.cos(view.phi),
    view.target.z + view.radius * Math.sin(view.phi) * Math.cos(view.theta)
  );
  camera.lookAt(view.target);
}

let dragging = 0;
let last = null;
canvas.addEventListener("pointerdown", (event) => {
  dragging = event.button === 2 ? 2 : 1;
  last = { x: event.clientX, y: event.clientY };
  view.spin = false;
  document.getElementById("spin").setAttribute("aria-pressed", "false");
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener("pointermove", (event) => {
  if (!dragging || !last) return;
  const dx = event.clientX - last.x;
  const dy = event.clientY - last.y;
  last = { x: event.clientX, y: event.clientY };
  if (dragging === 1) {
    view.theta -= dx * 0.006;
    view.phi -= dy * 0.006;
  } else {
    const scale = view.radius * 0.0016;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
    view.target.addScaledVector(right, -dx * scale).addScaledVector(up, dy * scale);
  }
  applyView();
});
for (const type of ["pointerup", "pointercancel", "pointerleave"]) {
  canvas.addEventListener(type, () => { dragging = 0; last = null; });
}
canvas.addEventListener("contextmenu", (event) => event.preventDefault());
canvas.addEventListener("wheel", (event) => {
  event.preventDefault();
  view.radius *= event.deltaY > 0 ? 1.12 : 0.89;
  applyView();
}, { passive: false });

let current = null;
let mixer = null;
let frameStart = 0;
// 동작 파일은 여러 모델이 함께 쓴다. 한 번 불러온 것은 들고 있는다.
const clipCache = new Map();

function clear() {
  if (!current) return;
  scene.remove(current);
  current.traverse((node) => {
    if (!node.isMesh && !node.isSkinnedMesh) return;
    node.geometry?.dispose();
    const materials = Array.isArray(node.material) ? node.material : [node.material];
    materials.forEach((material) => material?.dispose());
  });
  current = null;
  mixer = null;
}

function frameModel(root) {
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const span = Math.max(size.x, size.y, size.z) || 1;
  root.position.sub(center).multiplyScalar(2 / span);
  root.scale.setScalar(2 / span);
  view.target.set(0, 0, 0);
  view.radius = 4.6;
  view.theta = 0.9;
  view.phi = 1.25;
  applyView();
}

let wireframe = false;
function applyWireframe() {
  if (!current) return;
  current.traverse((node) => {
    if (!node.isMesh && !node.isSkinnedMesh) return;
    const materials = Array.isArray(node.material) ? node.material : [node.material];
    materials.forEach((material) => { if (material) material.wireframe = wireframe; });
  });
}

const notice = document.getElementById("notice");

async function load(entry, button) {
  document.querySelectorAll("button.item").forEach((node) =>
    node.setAttribute("aria-current", node === button ? "true" : "false"));
  document.getElementById("name").textContent = `${entry.family} — ${entry.variant}`;
  document.getElementById("sub").textContent = `${entry.name}.glb`;
  document.getElementById("stat").textContent = "불러오는 중…";
  document.getElementById("clips").innerHTML = "";
  notice.classList.remove("on");

  let gltf;
  try {
    gltf = await loader.loadAsync(entry.url);
  } catch (error) {
    document.getElementById("stat").textContent = "";
    notice.innerHTML = `<div><b>모델을 불러오지 못했다.</b><br>
      이 뷰어는 웹서버로 열어야 한다. 파일을 직접 열면(<code>file://</code>)
      브라우저가 모델 파일 읽기를 막는다.<br><br>
      <code>python -m http.server 8000</code> 으로 띄운 뒤<br>
      <code>http://localhost:8000/viewer.html</code> 로 들어오면 된다.<br><br>
      찾는 경로: <code>${entry.url}</code></div>`;
    notice.classList.add("on");
    return;
  }

  clear();
  current = gltf.scene;
  scene.add(current);
  frameModel(current);
  applyWireframe();

  let triangles = 0;
  current.traverse((node) => {
    if (!node.isMesh && !node.isSkinnedMesh) return;
    const geometry = node.geometry;
    if (!geometry?.attributes?.position) return;
    triangles += geometry.index
      ? geometry.index.count / 3 : geometry.attributes.position.count / 3;
  });
  document.getElementById("stat").innerHTML =
    `<b>${Math.round(triangles).toLocaleString()}</b> 삼각형 · <b>${entry.kb}</b>KB`
    + (entry.note ? ` · ${entry.note}` : "");

  /* 동작은 별도 파일에 들어 있다. 게임이 하는 것과 같은 방식으로 붙인다. */
  const sources = entry.clips.slice();
  if (gltf.animations?.length) sources.unshift(["기본 동작", null]);
  if (!sources.length) return;

  mixer = new THREE.AnimationMixer(current);
  const holder = document.getElementById("clips");
  const buttons = [];
  const setActive = (active) => buttons.forEach((node) =>
    node.setAttribute("aria-pressed", node === active ? "true" : "false"));

  for (const [label, url] of sources) {
    const play = document.createElement("button");
    play.textContent = label;
    buttons.push(play);
    play.addEventListener("click", async () => {
      let clip = gltf.animations?.[0];
      if (url) {
        if (!clipCache.has(url)) {
          play.textContent = "…";
          const extra = await loader.loadAsync(url);
          clipCache.set(url, extra.animations[0]);
          play.textContent = label;
        }
        clip = clipCache.get(url);
      }
      if (!clip) return;
      mixer.stopAllAction();
      mixer.clipAction(clip).reset().setLoop(THREE.LoopRepeat, Infinity).play();
      setActive(play);
    });
    holder.appendChild(play);
  }
  const stop = document.createElement("button");
  stop.textContent = "정지";
  stop.addEventListener("click", () => { mixer.stopAllAction(); setActive(null); });
  buttons.push(stop);
  holder.appendChild(stop);
}

const list = document.getElementById("list");
let currentFamily = null;
let first = null;
for (const entry of MODELS) {
  if (entry.family !== currentFamily) {
    currentFamily = entry.family;
    const heading = document.createElement("div");
    heading.className = "group";
    heading.textContent = currentFamily;
    list.appendChild(heading);
  }
  const button = document.createElement("button");
  button.className = "item";
  button.innerHTML = `${entry.variant}<small>${entry.triangles.toLocaleString()} 삼각형`
    + `${entry.clips.length ? " · 동작 있음" : ""}${entry.note ? ` · ${entry.note}` : ""}</small>`;
  button.addEventListener("click", () => load(entry, button));
  list.appendChild(button);
  if (!first) first = { entry, button };
}

document.getElementById("wire").addEventListener("click", (event) => {
  wireframe = !wireframe;
  event.currentTarget.setAttribute("aria-pressed", String(wireframe));
  applyWireframe();
});
document.getElementById("spin").addEventListener("click", (event) => {
  view.spin = !view.spin;
  event.currentTarget.setAttribute("aria-pressed", String(view.spin));
});
document.getElementById("reset").addEventListener("click", () => {
  if (current) frameModel(current);
});

function resize() {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (!width || !height) return;
  renderer.setSize(width, height, false);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

renderer.setAnimationLoop(() => {
  const now = performance.now();
  const delta = frameStart ? (now - frameStart) / 1000 : 0;
  frameStart = now;
  if (mixer) mixer.update(Math.min(delta, 0.05));
  if (view.spin) { view.theta += delta * 0.35; applyView(); }
  resize();
  renderer.render(scene, camera);
});

applyView();
if (first) load(first.entry, first.button);
</script>
